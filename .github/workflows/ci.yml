# Os testes só rodavam quando alguém lembrava. Com o serviço indo para um
# ambiente compartilhado, isso passa a rodar em todo push e PR.
name: CI

on:
  push:
    branches: ["master"]
  pull_request:

concurrency:
  # Um push novo na mesma branch cancela a execução anterior: não adianta
  # esperar CI de um commit que já foi substituído.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # Lint, formatação e tipos do Python, com o ruff e o mypy fixados no grupo dev (o formatador muda
    # de saída entre versões). Num job próprio para o erro de estilo não esconder o de teste.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: ruff check
        run: uv run ruff check --output-format=github .
      - name: ruff format --check
        run: uv run ruff format --check .
      - name: mypy
        # Modo gradual: só os módulos de [tool.mypy] files, em modo estrito.
        run: uv run mypy

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: pytest
        run: uv run pytest -q

  postgres:
    # O job de cima roda em SQLite. Este roda contra o Postgres de produção (a mesma
    # imagem do compose): migrações de ida e volta, SKIP LOCKED e LISTEN/NOTIFY da
    # fila de jobs, busca híbrida (pgvector + tsvector) e o trace store. Cada sessão
    # do pytest cria um banco próprio no servidor e o apaga no fim (tests/pg.py).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kuro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kuro_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # 127.0.0.1, não localhost: no runner, localhost resolve primeiro para ::1, onde a porta
      # do container não está mapeada, e a conexão estoura o tempo em vez de ser recusada.
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/kuro_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: pytest -m postgres
        # Sem o TEST_DATABASE_URL estes testes seriam pulados; com ele, servidor fora
        # do ar é erro (não pulo), então o job não fica verde sem ter testado nada.
        run: uv run pytest -q -m postgres -rs

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: test
        # A conta dos gráficos (src/lib/*.test.ts), com o test runner do próprio Node.
        run: npm test
      - name: build
        # O build do Next é o que pega erro de tipo e de import que o lint deixa passar.
        run: npm run build

  api-types:
    # `frontend/src/lib/api-types.gen.ts` sai do OpenAPI do serviço (`npm run gen:types`).
    # Mudou um modelo de resposta e ninguém regenerou: o console estaria tipado contra
    # um contrato que não existe mais. Regenera e falha se o arquivo mudar.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run gen:types
        working-directory: frontend
      - name: tipos gerados em dia
        run: |
          git diff --exit-code -- frontend/src/lib/api-types.gen.ts || {
            echo "::error::frontend/src/lib/api-types.gen.ts está desatualizado: rode 'npm run gen:types' em frontend/ e faça commit."
            exit 1
          }

  e2e:
    # Smoke do console com Playwright: criar agente → conversar → sessão → trace,
    # contra o serviço real com SQLite e um modelo determinístico
    # (scripts/servico_de_teste.py). Sem Postgres e sem provedor de LLM.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: navegador do Playwright
        run: npx playwright install --with-deps chromium
      - name: smoke
        # O playwright.config.ts faz o build e sobe backend e console nas portas 58100 e 3100.
        run: npm run e2e
      - name: relatório e traces do Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14

  images:
    # Build das duas imagens: um Dockerfile quebrado só apareceria no deploy.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: agent-service
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: kuro-agent-service:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: kuro-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
