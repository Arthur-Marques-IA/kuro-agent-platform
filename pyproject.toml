[project]
name = "agent-service"
version = "0.2.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Arthur Marques", email = "joao_arthur@discente.ufg.br" }
]
requires-python = ">=3.12"
dependencies = [
    "agno>=3.0.9",
    "aiofiles>=25.1.0",
    "alembic>=1.14",
    "anthropic>=0.40",
    "asyncpg>=0.31.0",
    "click>=8.1",
    "cryptography>=44",
    "fastapi>=0.141.1",
    "google-genai>=2.23.0",
    "httpx>=0.28",
    # O serviço serve as tools MCP em `/mcp`, e a imagem traz o `kuro-mcp` para o
    # `kuro connect` chamar por SSH (`docker exec`).
    "mcp>=2.3",
    "ollama>=0.4",
    "openai>=1.0",
    "openpyxl>=3.1.5",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.5",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "python-pptx>=1.0.2",
    "questionary>=2.1",
    "rich>=13",
    "sqlalchemy>=2.0.52",
    "sse-starlette>=3.4.11",
    "typer>=0.15",
    "uvicorn[standard]>=0.53.0",
    "xlrd>=2.0.2",
]

[project.scripts]
kuro = "agent_service.cli.main:main"
kuro-migrate = "agent_service.migrations:main"
# Servidor MCP por stdio (precisa do extra `mcp`). Ver docs/mcp.md.
kuro-mcp = "agent_service.mcp_server:main"

[project.optional-dependencies]
# Exportador opcional para o Langfuse. Sem ele, as execuções ficam só no trace
# store local (Postgres) — o que já alimenta `kuro runs` e `/observability/*`.
observability = [
    "langfuse>=4.15.3",
    "openinference-instrumentation-agno>=1.0.10",
]
tools = [
    # A tool builtin "Busca na web" (agent_service/tools/catalog.py) precisa
    # disso; as demais builtins do catálogo já funcionam sem instalar nada.
    "ddgs>=9.0.0",
]
# O `mcp` já é dependência do serviço; o extra fica para não quebrar quem instala com
# `agent-service[mcp]` (os comandos do `uvx` na documentação e no `kuro mcp-config`).
mcp = [
    "mcp>=2.3",
]
# Só na máquina de quem opera: a TUI (`kuro dash`) é cliente da API, como a CLI.
tui = [
    "textual>=8.2",
]

[build-system]
requires = ["uv_build>=0.11.33,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    # Os testes do exportador usam o SDK do Langfuse de verdade (sem rede).
    "agent-service[observability]",
    # Os testes do servidor MCP e da TUI rodam o cliente MCP e o Pilot do Textual.
    "agent-service[mcp,tui]",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.ruff]
target-version = "py312"
