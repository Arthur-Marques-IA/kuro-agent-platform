[project]
name = "agent-service"
version = "0.2.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Arthur Marques", email = "joao_arthur@discente.ufg.br" }
]
requires-python = ">=3.12"
dependencies = [
    "agno>=3.0.9",
    "aiofiles>=25.1.0",
    "alembic>=1.14",
    "anthropic>=0.40",
    "asyncpg>=0.31.0",
    "click>=8.1",
    "cryptography>=44",
    "fastapi>=0.141.1",
    "google-genai>=2.23.0",
    "httpx>=0.28",
    "ollama>=0.4",
    "openai>=1.0",
    "openpyxl>=3.1.5",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.5",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "python-pptx>=1.0.2",
    "questionary>=2.1",
    "rich>=13",
    "sqlalchemy>=2.0.52",
    "sse-starlette>=3.4.11",
    "typer>=0.15",
    "uvicorn[standard]>=0.53.0",
    "xlrd>=2.0.2",
]

[project.scripts]
kuro = "agent_service.cli.main:main"
kuro-migrate = "agent_service.migrations:main"
# Servidor MCP por stdio (precisa do extra `mcp`). Ver docs/mcp.md.
kuro-mcp = "agent_service.mcp_server:main"

[project.optional-dependencies]
# Exportador opcional para o Langfuse. Sem ele, as execuções ficam só no trace
# store local (Postgres) — o que já alimenta `kuro runs` e `/observability/*`.
observability = [
    "langfuse>=4.15.3",
    "openinference-instrumentation-agno>=1.0.10",
]
mem0 = [
    "mem0ai>=2.0.20",
]
tools = [
    # Pacotes das toolkits do catálogo de builtins (agent_service/tools/catalog.py).
    # Sem este extra, o catálogo mostra essas entradas como indisponíveis; as
    # demais (calculadora, Linear, WhatsApp, Zendesk...) já funcionam sem ele.
    "ddgs>=9.0.0",
    "tavily-python>=0.8.4",
    "wikipedia>=1.4.0",
    "youtube-transcript-api>=1.2.4",
    "yfinance>=1.7.0",
    "pygithub>=2.10.0",
    "python-gitlab>=8.6.0",
    "jira>=3.10.5",
    "atlassian-python-api>=5.0.5",
    "notion-client>=3.1.0",
    "pytz>=2026.3",
    "slack-sdk>=3.45.0",
    "pytelegrambotapi>=4.37.0",
    "twilio>=9.11.2",
    "resend>=2.49.1",
]
# Só na máquina de quem opera: o servidor MCP (`kuro-mcp`) e a TUI (`kuro dash`)
# são clientes da API, como a CLI. A imagem do serviço não precisa de nenhum dos dois.
mcp = [
    "mcp>=2.3",
]
tui = [
    "textual>=8.2",
]

[build-system]
requires = ["uv_build>=0.11.33,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    # Os testes do exportador usam o SDK do Langfuse de verdade (sem rede).
    "agent-service[observability]",
    # Os testes do servidor MCP e da TUI rodam o cliente MCP e o Pilot do Textual.
    "agent-service[mcp,tui]",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
